<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1532px;height:430px;background:#FFFFFF;" width="1532px" height="430px" viewBox="0 0 1532 430" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="544.383" y="22.995" fill="#000" font-size="14" textLength="436.898" font-weight="700">ClinicBook - Appointment state diagram (Fioralba Zika)</text></g><g class="entity" data-qualified-name="Booked" id="ent0001" data-source-line="5"><rect x="564.74" y="140.297" width="72.343" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="564.74" y1="166.594" x2="637.083" y2="166.594" style="stroke:#181818;stroke-width:0.5;"/><text x="574.74" y="158.292" fill="#000" font-size="14" textLength="52.343">Booked</text></g><g class="entity" data-qualified-name="Cancelled" id="ent0002" data-source-line="6"><rect x="556.51" y="267.297" width="88.817" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="556.51" y1="293.594" x2="645.327" y2="293.594" style="stroke:#181818;stroke-width:0.5;"/><text x="566.51" y="285.292" fill="#000" font-size="14" textLength="68.817">Cancelled</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="8"><ellipse cx="600.92" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0007" data-source-line="13"><ellipse cx="600.92" cy="405.297" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="600.92" cy="405.297" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="16"><path d="M672.52,141.087 L672.52,161.297 L637.53,165.297 L672.52,169.297 L672.52,189.501 A0,0 0 0 0 672.52,189.501 L1217.314,189.501 A0,0 0 0 0 1217.314,189.501 L1217.314,151.087 L1207.314,141.087 L672.52,141.087 A0,0 0 0 0 672.52,141.087" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1207.314,141.087 L1207.314,151.087 L1217.314,151.087 L1207.314,141.087" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="678.52" y="156.297" fill="#000" font-size="11" textLength="523.794">Only BOOKED occupies a slot and counts towards the limit of 2 future bookings (FR-04, FR-05).</text><text x="678.52" y="169.102" fill="#000" font-size="11" textLength="481.153">A refused cancel request leaves the state unchanged: wrong owner, start not in future,</text><text x="678.52" y="181.907" fill="#000" font-size="11" textLength="330.886">or patient less than 24 h before start (FR-06, US-08, US-09).</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="22"><path d="M6,141.087 L6,189.501 A0,0 0 0 0 6,189.501 L529.831,189.501 A0,0 0 0 0 529.831,189.501 L529.831,169.297 L564.36,165.297 L529.831,161.297 L529.831,151.087 L519.831,141.087 L6,141.087 A0,0 0 0 0 6,141.087" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M519.831,141.087 L519.831,151.087 L529.831,151.087 L519.831,141.087" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="156.297" fill="#000" font-size="11" textLength="259.064">Time passing alone is not a cancellation event.</text><text x="12" y="169.102" fill="#000" font-size="11" textLength="502.831">No automatic attendance or no-show transition is drawn: the shared documents do not say</text><text x="12" y="181.907" fill="#000" font-size="11" textLength="301.012">who records those outcomes or when (open question).</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="28"><path d="M680.33,268.087 L680.33,288.297 L645.79,292.297 L680.33,296.297 L680.33,316.501 A0,0 0 0 0 680.33,316.501 L1187.511,316.501 A0,0 0 0 0 1187.511,316.501 L1187.511,278.087 L1177.511,268.087 L680.33,268.087 A0,0 0 0 0 680.33,268.087" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1177.511,268.087 L1177.511,278.087 L1187.511,278.087 L1177.511,268.087" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="686.33" y="283.297" fill="#000" font-size="11" textLength="297.457">Terminal state of this modelled lifecycle, not deletion.</text><text x="686.33" y="296.102" fill="#000" font-size="11" textLength="486.181">Cancelled records are retained (proposed assumption) and the slot becomes free again.</text><text x="686.33" y="308.907" fill="#000" font-size="11" textLength="462.236">Exactly 24 h before start is still allowed for a patient cancel (proposed assumption).</text></g><!--link *start* to Booked--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="8" data-link-type="dependency"><path d="M600.92,63.677 C600.92,80.407 600.92,110.887 600.92,134.927" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Booked"/><polygon points="600.92,139.927,604.92,130.927,600.92,134.927,596.92,130.927,600.92,139.927" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="601.92" y="106.364" fill="#000" font-size="13" textLength="418.495">book (FR-03) [registered patient, free slot] / create appointment</text></g><!--link Booked to Cancelled--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="10" data-link-type="dependency"><path d="M564.31,184.457 C558.59,186.737 552.67,188.797 546.92,190.297 C477.17,208.507 272.47,167.017 223.92,220.297 C177.99,270.687 441.693,285.701 551.113,289.771" style="stroke:#181818;stroke-width:1;" fill="none" id="Booked-to-Cancelled"/><polygon points="556.11,289.957,547.265,285.625,551.113,289.771,546.968,293.62,556.11,289.957" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="224.92" y="233.364" fill="#000" font-size="13" textLength="707.173">patient cancels [owner AND start in future AND at least 24 h before start] / status = Cancelled, slot released</text></g><!--link Booked to Cancelled--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="11" data-link-type="dependency"><path d="M637.54,184.397 C643.25,186.677 649.17,188.757 654.92,190.297 C715.78,206.627 894.78,173.437 936.92,220.297 C941.97,225.917 941.96,231.667 936.92,237.297 C896.03,282.907 722.42,252.787 662.92,267.297 C657.2,268.687 656.034,268.876 650.244,270.846" style="stroke:#181818;stroke-width:1;" fill="none" id="Booked-to-Cancelled-1"/><polygon points="645.51,272.457,655.319,273.345,650.244,270.846,652.742,265.771,645.51,272.457" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="940.92" y="233.364" fill="#000" font-size="13" textLength="575.745">receptionist cancels [receptionist AND start in future] / status = Cancelled, slot released</text></g><!--link Cancelled to *end*--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="13" data-link-type="dependency"><path d="M600.92,317.657 C600.92,341.527 600.92,371.757 600.92,389.007" style="stroke:#181818;stroke-width:1;" fill="none" id="Cancelled-to-*end*"/><polygon points="600.92,394.007,604.92,385.007,600.92,389.007,596.92,385.007,600.92,394.007" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="601.92" y="360.364" fill="#000" font-size="13" textLength="310.14">record retained; no further cancellation defined</text></g><?plantuml-src ZLDBRzGm4BxdLunwsaMxq9Q2O158VLwGMed2XQg7MMUoiUfuWkqqb5_FZ9FTQDKYSLblFFOttsESR784vyvwQywO7s09fstBrgU6V8AOC16K5ZS16vXTMGxerWW_xGFEYo8-MD-YbZmdkcAVRkqVWgCZAUMR1uf9vG5WXE7ljd2Etf1pOsttLHHth-vXkVmo7eSLh9NMxEhRyl3j7Eu2RMnC5AJKOh92SW5L88BeEDt36p21j05EAefYn5BONIT