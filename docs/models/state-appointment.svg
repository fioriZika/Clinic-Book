<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="422px" preserveAspectRatio="none" style="width:1792px;height:422px;background:#FFFFFF;" version="1.1" viewBox="0 0 1792 422" width="1792px" zoomAndPan="magnify"><title>State diagram - Appointment lifecycle (FR-03, FR-06, FR-08, FR-16)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="495.0996" x="641.7426" y="23.5352">State diagram - Appointment lifecycle (FR-03, FR-06, FR-08, FR-16)</text><g id="Booked"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="70.0459" x="820.54" y="140.4883"/><line style="stroke:#181818;stroke-width:0.5;" x1="820.54" x2="890.5859" y1="166.9766" y2="166.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.0459" x="830.54" y="159.0234">Booked</text></g><g id="Cancelled"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="85.7822" x="812.67" y="267.4883"/><line style="stroke:#181818;stroke-width:0.5;" x1="812.67" x2="898.4522" y1="293.9766" y2="293.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.7822" x="822.67" y="286.0234">Cancelled</text></g><g id="Attended"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="82.043" x="1433.54" y="267.4883"/><line style="stroke:#181818;stroke-width:0.5;" x1="1433.54" x2="1515.583" y1="293.9766" y2="293.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.043" x="1443.54" y="286.0234">Attended</text></g><g id="NoShow"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="82.2549" x="302.44" y="267.4883"/><line style="stroke:#181818;stroke-width:0.5;" x1="302.44" x2="384.6949" y1="293.9766" y2="293.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="62.2549" x="312.44" y="286.0234">No-show</text></g><ellipse cx="855.56" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="855.56" cy="405.4883" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="855.56" cy="405.4883" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1.0;"/><g id="elem_GMN17"><path d="M925.29,147.5283 L925.29,161.4883 L890.97,165.4883 L925.29,169.4883 L925.29,183.4384 A0,0 0 0 0 925.29,183.4384 L1275.8442,183.4384 A0,0 0 0 0 1275.8442,183.4384 L1275.8442,157.5283 L1265.8442,147.5283 L925.29,147.5283 A0,0 0 0 0 925.29,147.5283 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1265.8442,147.5283 L1265.8442,157.5283 L1275.8442,157.5283 L1265.8442,147.5283 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="229.1899" x="931.29" y="163.163">The only state that occupies a doctor's slot</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="329.5542" x="931.29" y="176.1181">and counts towards the 2-future-appointments limit (FR-05).</text></g><g id="elem_GMN20"><path d="M6,274.5283 L6,310.4384 A0,0 0 0 0 6,310.4384 L267.1255,310.4384 A0,0 0 0 0 267.1255,310.4384 L267.1255,296.4883 L302,292.4883 L267.1255,288.4883 L267.1255,284.5283 L257.1255,274.5283 L6,274.5283 A0,0 0 0 0 6,274.5283 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M257.1255,274.5283 L257.1255,284.5283 L267.1255,284.5283 L257.1255,274.5283 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="240.1255" x="12" y="290.163">Three no-shows in 90 days mean the patient</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="225.5376" x="12" y="303.1181">may only book through reception (FR-09).</text></g><!--link *start* to Booked--><g id="link_*start*_Booked"><path d="M855.56,63.8683 C855.56,80.5983 855.56,110.0783 855.56,134.1183 " fill="none" id="*start*-to-Booked" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="855.56,140.1183,859.56,131.1183,855.56,135.1183,851.56,131.1183,855.56,140.1183" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.9678" x="856.56" y="107.0566">book (FR-03) / create in free slot with UNIQUE(doctor, start)</text></g><!--link Booked to Cancelled--><g id="link_Booked_Cancelled"><path d="M820.24,166.8183 C743.54,168.3783 565.69,176.7183 528.56,220.4883 C490.7,265.1183 709.0406,283.1216 806.2706,288.9116 " fill="none" id="Booked-to-Cancelled" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="812.26,289.2683,803.5137,284.7404,807.2688,288.9711,803.0381,292.7262,812.26,289.2683" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.5913" x="529.56" y="234.0566">patient cancels, now &lt;= start - 24 h (FR-06)</text></g><!--link Booked to Cancelled--><g id="link_Booked_Cancelled"><path d="M853.69,190.7983 C852.85,204.5083 852.13,221.9483 852.56,237.4883 C852.83,247.1583 853.0139,251.7989 853.5639,261.0489 " fill="none" id="Booked-to-Cancelled-1" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="853.92,267.0383,857.3788,257.8167,853.6232,262.0471,849.3929,258.2916,853.92,267.0383" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.0117" x="853.56" y="234.0566">receptionist cancels at any time (FR-06)</text></g><!--link Booked to Cancelled--><g id="link_Booked_Cancelled"><path d="M890.85,184.3883 C896.35,186.7083 902.04,188.8383 907.56,190.4883 C951.05,203.4583 1079.92,186.1183 1109.56,220.4883 C1114.5,226.2083 1114.32,231.6183 1109.56,237.4883 C1083.53,269.6383 970.2909,282.9593 904.8609,288.1993 " fill="none" id="Booked-to-Cancelled-2" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="898.88,288.6783,908.1706,291.947,903.864,288.2791,907.532,283.9726,898.88,288.6783" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="425.7373" x="1114.2" y="234.0566">reschedule (FR-16) / new slot booked, old one cancelled atomically</text></g><!--link Booked to Attended--><g id="link_Booked_Attended"><path d="M891,185.0083 C896.43,187.2083 902.06,189.1483 907.56,190.4883 C976.83,207.4083 1499.34,168.9083 1548.56,220.4883 C1566.02,238.7783 1546.5922,255.7176 1521.1522,269.7676 " fill="none" id="Booked-to-Attended" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1515.9,272.6683,1525.7121,271.8187,1520.2769,270.251,1521.8445,264.8157,1515.9,272.6683" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.1948" x="1555.39" y="234.0566">receptionist marks attended (FR-08)</text></g><!--link Booked to NoShow--><g id="link_Booked_NoShow"><path d="M820.4,167.1283 C701.76,169.6583 321.64,180.8283 285.56,220.4883 C271.85,235.5583 281.6183,249.619 299.5483,263.599 " fill="none" id="Booked-to-NoShow" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="304.28,267.2883,299.642,258.5999,300.3369,264.2139,294.7229,264.9088,304.28,267.2883" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.6455" x="286.56" y="234.0566">receptionist marks no-show (FR-08)</text></g><!--link Cancelled to *end*--><g id="link_Cancelled_*end*"><path d="M855.56,317.8483 C855.56,341.7183 855.56,370.9483 855.56,388.1983 " fill="none" id="Cancelled-to-*end*" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="855.56,394.1983,859.56,385.1983,855.56,389.1983,851.56,385.1983,855.56,394.1983" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.3711" x="856.56" y="361.0566">slot is free again (US-06)</text></g><!--link Attended to *end*--><g id="link_Attended_*end*"><path d="M1433.47,300.8583 C1308.18,323.3283 941.2558,389.1192 872.4458,401.4592 " fill="none" id="Attended-to-*end*" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="866.54,402.5183,876.1047,404.8668,871.4615,401.6357,874.6926,396.9924,866.54,402.5183" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.8975" x="1166.06" y="361.0566">kept for the monthly report (FR-12)</text></g><!--link NoShow to *end*--><g id="link_NoShow_*end*"><path d="M385.07,305.0883 C439.53,320.0583 538.21,346.3383 623.56,364.4883 C707.92,382.4283 804.8831,397.1002 838.4631,402.0102 " fill="none" id="NoShow-to-*end*" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="844.4,402.8783,836.0734,397.6183,839.4526,402.1549,834.916,405.5341,844.4,402.8783" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.9995" x="624.56" y="361.0566">counted in the last 90 days (FR-09)</text></g><!--SRC=[XLDDRzD04BtxLunw8K4n985MRGL81L69IwGISa8Sjkj9l8gzO-sE5PbVp-o7dL8LSTgrPzwyzsPcsN23i6N529LH1wTQAE6kwyXORj4oD6QFUj2IDRl_NYxVBI0SL-cuZiVgQbuK_cXifmBU4kCzMTwQtmYhbOHY-OlFH4UiBa1vIDSny4LPZKsJOzFN6BvZHblbwFWn1ZTK-ffECRQXhLoBukVhNr2Mdp8BtCAZNBByERm5xJ1WZOMzGmJV4CF9S0sxpRU7tTTPHPh9BK0e78krN2UKdCH9rKwn2HtIyPzVYF4JVFYOODB5zNke4wlqvnyr76his90rVYe4Ya7P0T